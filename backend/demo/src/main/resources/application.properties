spring.config.import=optional:file:.env[.properties]

spring.application.name=freshguard

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Adafruit IO MQTT
adafruit.username=
adafruit.key=
adafruit.mqtt.host=io.adafruit.com
adafruit.mqtt.port=1883

# CORS (allow frontend)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# JWT
jwt.secret=freshguard-super-secret-key-must-be-at-least-32-chars!!
jwt.expiration-ms=86400000
jwt.reset-password-expiration-ms=${JWT_RESET_PASSWORD_EXPIRATION_MS:900000}

# Mail (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:
spring.mail.password=${APP_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:nghia.nguyen170305@hcmut.edu.vn}}

# Frontend links for emails
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3001}
app.frontend.login-path=${APP_FRONTEND_LOGIN_PATH:/login}
app.frontend.change-password-path=${APP_FRONTEND_CHANGE_PASSWORD_PATH:/change-password}
