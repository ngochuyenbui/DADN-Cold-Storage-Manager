<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshGuard - Đặt lại mật khẩu</title>
</head>
<body style="margin:0;padding:0;background:#080e1d;font-family:Arial, Helvetica, sans-serif;color:#dbe6ff;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#080e1d;padding:36px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" style="max-width:640px;width:100%;background:#131d31;border-radius:18px;overflow:hidden;border:1px solid rgba(127,224,219,0.10);">
          <tr>
            <td style="background:#0b1220;padding:24px 24px;text-align:center;border-bottom:1px solid rgba(127,224,219,0.10);">
              <div style="font-size:32px;line-height:1.1;color:#f3f7ff;font-weight:800;">FreshGuard</div>
              <div style="margin-top:8px;font-size:13px;line-height:1.6;color:#9aa9c5;">Yêu cầu đặt lại mật khẩu</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 24px;color:#dbe6ff;">
              <p style="margin:0 0 14px 0;">Xin chào <strong>${username}</strong>,</p>
              <p style="margin:0 0 18px 0;line-height:1.7;color:#bfeceb;">Bạn vừa yêu cầu đặt lại mật khẩu. Bấm nút bên dưới để tạo mật khẩu mới.</p>
              <div style="text-align:center;margin:24px 0;">
                <a href="${url}" target="_blank" style="display:inline-block;padding:12px 18px;border-radius:10px;background:#60d5cf;color:#0b1220;font-weight:700;text-decoration:none;">Đặt lại mật khẩu</a>
              </div>
              <p style="margin:0 0 10px 0;color:#9aa9c5;font-size:13px;line-height:1.6;">Nếu nút không bấm được, dùng link sau:</p>
              <p style="margin:0;color:#7fe0db;font-size:13px;line-height:1.6;"><a href="${url}" target="_blank" style="color:#7fe0db;text-decoration:underline;font-weight:700;">Mở link đặt lại mật khẩu</a></p>
              <div style="margin-top:22px;padding:14px 16px;border-left:4px solid #7fe0db;background:rgba(127,224,219,0.06);border-radius:10px;color:#dbe6ff;font-size:13px;line-height:1.6;">
                Link có hiệu lực trong 15 phút. Nếu bạn không yêu cầu, hãy bỏ qua email này.
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
